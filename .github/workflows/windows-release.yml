name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt -r requirements-dev.txt
      - name: Audit public source history
        run: python release_guard.py --git-history
      - name: Verify release version
        shell: pwsh
        run: |
          $tagArguments = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tagArguments = @('--tag', $env:GITHUB_REF_NAME) }
          python release_tools.py --check-source . @tagArguments
          if ($LASTEXITCODE -ne 0) { throw 'Release source verification failed.' }
      - name: Run regression tests
        run: python -m pytest -x -q tests
      - name: Test Android release preflight tools
        working-directory: android
        run: python -m pytest -x -q tests
      - name: Build executable, source and update manifest
        shell: pwsh
        run: ./build_windows.ps1 -PythonExecutable (Get-Command python).Source -OutputDirectory "$env:RUNNER_TEMP\SynoStream-release" -SkipDependencyInstall
      - name: Audit release artifacts before upload
        run: python -c "from publish_release import verify; verify(r'${{ runner.temp }}/SynoStream-release')"
      - name: Preserve release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SynoStream-Windows-release
          path: |
            ${{ runner.temp }}/SynoStream-release/SynoStream_*.exe
            ${{ runner.temp }}/SynoStream-release/SynoStream_*_Windows_x64.zip
            ${{ runner.temp }}/SynoStream-release/SynoStream_*_Source.zip
            ${{ runner.temp }}/SynoStream-release/SynoStream_*_SHA256.txt
            ${{ runner.temp }}/SynoStream-release/update.json
          if-no-files-found: error
      - name: Prepare GitHub draft release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python publish_release.py --directory "${{ runner.temp }}/SynoStream-release"
